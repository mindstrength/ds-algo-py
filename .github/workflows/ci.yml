name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'config/pip_requirements.txt'

      - name: Install dependencies
        run: pip install -r config/pip_requirements.txt

      - name: Run unit tests
        run: python -m unittest discover --start-directory lib --verbose

      - name: Run pylint
        run: python -m pylint --ignore test lib
